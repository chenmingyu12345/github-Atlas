<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="为学生和上班族整理的效率工具导航。按行业、岗位和具体任务找到适合的工具。">
  <meta name="theme-color" content="#f5f7f6">
  <title>效率工具图鉴 · GitHub Atlas</title>
  <link rel="stylesheet" href="style.css?v=accounts">
  <link rel="icon" href="assets/online.webp" type="image/webp">
  <script src="tools.js?v=skill-feedback" defer></script>
  <script src="stars.js?v=skill-feedback" defer></script>
  <script src="skill-sources.js" defer></script>
  <script src="ballots.js" defer></script>
  <script src="vote-config.js" defer></script>
  <script src="account.js" defer></script>
  <script src="main.js?v=accounts" defer></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><img class="brand-icon" src="assets/online.webp" alt="" width="38" height="38">效率工具图鉴</a>
    <div class="top-actions">
      <button class="library" id="saved" type="button" aria-pressed="false"><span aria-hidden="true">☆</span> 我的收藏 <span id="saved-count">0</span></button>
      <button class="library" id="account-open" type="button" hidden>登录</button>
    </div>
  </div></header>
  <dialog class="account-dialog" id="account-dialog">
    <div class="account-heading"><h2 id="account-title">登录</h2><button id="account-close" class="library" type="button">关闭</button></div>
    <form id="account-form">
      <label>账号<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="字母、数字或下划线"></label>
      <label id="account-nickname" hidden>昵称<input name="displayName" maxlength="32" autocomplete="nickname"></label>
      <label>密码<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"></label>
      <div class="account-buttons"><button type="submit" class="account-primary">登录</button><button type="button" class="library" id="account-mode">注册账号</button></div>
    </form>
    <div id="account-profile" hidden><p id="account-user"></p><button type="button" class="library" id="account-logout">退出登录</button></div>
    <p id="account-status" role="status"></p>
  </dialog>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-content">
        <h1 id="title">今天，你想完成什么？</h1>
        <p class="hero-copy">从写论文到做报表，找到顺手的在线工具、AI 技能和开源软件。</p>
        <form class="search" id="search-form" role="search">
          <label for="query" class="sr-only">搜索工具或任务</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input id="query" type="search" placeholder="搜索工具或任务，例如：论文、PDF、录屏" autocomplete="off">
          <button type="submit">搜索</button>
        </form>
      </div>
    </section>
    <nav class="type-nav" aria-label="资源类型" id="types">
      <button type="button" data-type="online" aria-pressed="false"><img src="assets/online.webp" width="50" height="50" alt=""><span><strong>在线工具</strong><small>文档协作、翻译与制图</small></span></button>
      <button type="button" data-type="skill" aria-pressed="false"><img src="assets/skill.webp" width="50" height="50" alt=""><span><strong>AI 技能</strong><small>给 AI 助手添加工作能力</small></span></button>
      <button type="button" data-type="project" aria-pressed="false"><img src="assets/project.webp" width="50" height="50" alt=""><span><strong>开源项目</strong><small>桌面软件与可部署工具</small></span></button>
    </nav>
    <div class="workspace">
      <aside class="sidebar" aria-labelledby="role-heading">
        <h2 id="role-heading">按身份与行业</h2>
        <div id="roles" class="roles" role="group" aria-label="身份与行业"></div>
      </aside>
      <section class="directory" aria-labelledby="result-title">
        <div class="section-head">
          <div><h2 id="result-title">精选工具</h2><p id="role-note"></p></div>
          <div class="result-controls">
            <span id="result-count" role="status"></span>
            <label class="sr-only" for="sort">排序方式</label>
            <select id="sort"><option value="stars">Star 从高到低</option><option value="recommended">推荐顺序</option></select>
          </div>
        </div>
        <p class="star-note" id="star-note"></p>
        <div id="tasks" class="tasks" role="group" aria-label="任务分类"></div>
        <div id="results" class="cards"></div>
        <button class="more" id="more" type="button" hidden>显示更多</button>
        <noscript>请启用 JavaScript 后使用搜索和筛选。</noscript>
      </section>
    </div>
  </main>
  <footer class="wrap footer"><span>效率工具图鉴 · GitHub Atlas</span><div><a href="https://github.com/chenmingyu12345/github-Atlas/issues/new">推荐工具</a><a href="https://github.com/chenmingyu12345/github-Atlas/releases">下载开源项目导航</a></div></footer>
  <template id="card-template">
    <article class="card">
      <div class="card-top"><span class="tool-type"><img alt="" width="31" height="31"><span></span></span><button class="bookmark" type="button" aria-pressed="false"></button></div>
      <h3></h3><p class="description"></p>
      <div class="install" hidden>
        <p class="install-label">发给桌面端智能体</p>
        <button class="copy-install" type="button">复制安装提示词</button>
        <span class="copy-status" role="status"></span>
        <textarea aria-label="安装提示词，可滚动阅读" readonly rows="3"></textarea>
      </div>
      <div class="card-foot"><span class="category"></span><span class="stars"></span></div>
      <div class="skill-sources" hidden><p>实测与教程</p><ul></ul></div>
      <div class="skill-vote" hidden>
        <div class="vote-actions" role="group" aria-label="推荐或不推荐">
          <button type="button" data-choice="1" aria-label="推荐" aria-pressed="false" title="推荐"><span aria-hidden="true">👍</span> <span class="vote-total">–</span></button>
          <button type="button" data-choice="-1" aria-label="不推荐" aria-pressed="false" title="不推荐"><span aria-hidden="true">👎</span> <span class="vote-total">–</span></button>
        </div>
        <span class="vote-status" role="status"></span>
        <a class="vote-link" target="_blank" rel="noopener noreferrer">GitHub 投票</a>
      </div>
      <div class="card-links"><a class="entry-link" target="_blank" rel="noopener noreferrer"></a><a class="repository-link" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    </article>
  </template>
</body>
</html>
