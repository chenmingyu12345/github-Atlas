<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理后台 · 效率工具图鉴</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../tools.js" defer></script>
  <script src="../vote-config.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="top"><div class="admin-shell top-inner">
    <a class="brand" href="../"><img class="brand-icon" src="../assets/online.webp" alt="" width="38" height="38">效率工具图鉴</a>
    <a class="text-link" href="../">查看前台</a>
  </div></header>
  <main class="admin-shell">
    <section id="login-view" class="login-panel">
      <h1>管理后台</h1>
      <form id="login">
        <label for="admin-key">管理密钥</label>
        <input id="admin-key" name="admin-key" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">进入后台</button>
        <p id="login-status" role="status"></p>
      </form>
    </section>
    <section id="dashboard" hidden>
      <div class="admin-heading">
        <div><h1>资源管理</h1><p id="metrics"></p></div>
        <div class="header-actions"><button type="button" id="add" class="primary">新增资源</button><button type="button" id="logout" class="secondary">退出</button></div>
      </div>
      <div class="admin-panel">
        <div class="filters">
          <label>搜索资源<input id="filter-text" type="search" placeholder="名称、关键词或仓库"></label>
          <label>类型<select id="filter-kind"><option value="">全部类型</option><option value="online">在线工具</option><option value="skill">AI 技能</option><option value="project">开源项目</option></select></label>
          <label>状态<select id="filter-state"><option value="">全部状态</option><option value="1">已上架</option><option value="0">已下架</option></select></label>
        </div>
        <p id="list-status" role="status"></p>
        <div class="table-scroll">
          <table>
            <thead><tr><th scope="col">资源</th><th scope="col">类型</th><th scope="col">任务</th><th scope="col">状态</th><th scope="col">推荐</th><th scope="col">不推荐</th><th scope="col">操作</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <dialog id="editor">
      <form id="resource-form">
        <div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="cancel" class="secondary">关闭</button></div>
        <div class="field-grid">
          <label class="wide">资源名称<input name="name" required maxlength="80"></label>
          <label>类型<select name="kind"><option value="online">在线工具</option><option value="skill">AI 技能</option><option value="project">开源项目</option></select></label>
          <label>任务<select name="task" required></select></label>
          <label class="wide">官方入口<input name="url" type="url" required maxlength="500" placeholder="https://"></label>
          <label class="wide">GitHub 仓库<input name="repository" placeholder="owner/repository"><small id="skill-help" hidden>AI 技能的官方入口应指向该仓库里的技能目录。</small></label>
          <label class="wide">简介<textarea name="description" rows="3" required maxlength="600"></textarea></label>
          <label class="wide">搜索关键词<input name="keywords" maxlength="350"></label>
          <fieldset class="wide"><legend>适用人群</legend><div id="audience-options" class="checks"></div></fieldset>
          <label class="checkbox wide"><input name="visible" type="checkbox" checked>在前台上架</label>
        </div>
        <p id="save-status" role="status"></p>
        <button type="submit" class="primary">保存资源</button>
      </form>
    </dialog>
  </main>
</body>
</html>
